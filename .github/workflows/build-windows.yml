name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      cuda:
        description: "Includere i binari CUDA (+~600 MB). Vulkan copre già GPU NVIDIA/AMD/Intel."
        type: boolean
        default: false
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Windows llama.cpp binaries (CPU + Vulkan, optional CUDA)
        shell: bash
        run: |
          if [ "${{ inputs.cuda }}" = "true" ]; then node scripts/fetch-win-binaries.mjs --cuda; else node scripts/fetch-win-binaries.mjs; fi

      - name: Unit tests
        run: npm test

      - name: Smoke test native binding (load llama.cpp on Windows, CPU)
        shell: bash
        run: node -e "import('node-llama-cpp').then(async m=>{const l=await m.getLlama({gpu:false,build:'never'});console.log('llama.cpp OK on',process.platform,'gpu=',l.gpu)})"

      - name: Build NSIS installer + portable zip
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis zip --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeuralDeck-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
